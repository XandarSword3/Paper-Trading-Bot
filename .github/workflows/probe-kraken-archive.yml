name: Probe Kraken Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install -q gdown

      - name: Download Kraken archive and probe contents
        run: |
          {
            echo "=== Download start: $(date -u) ==="
            gdown 1ptNqWYidLkhb2VAKuLCxmp2OXEfGO-AP -O kraken_full.zip || echo "gdown FAILED"
            echo "=== Download end: $(date -u) ==="
            echo "=== File size ==="
            ls -lh kraken_full.zip 2>&1 || echo "no file present"
            echo "=== Zip entry count ==="
            unzip -l kraken_full.zip 2>&1 | tail -3
            echo "=== BTC/XBT pair entries ==="
            unzip -l kraken_full.zip 2>&1 | grep -iE "btcusd|xbtusd" || echo "no BTC/XBT matches"
            echo "=== Disk space remaining ==="
            df -h .
          } > archive_probe.txt 2>&1
          cat archive_probe.txt

      - name: Commit probe results
        if: always()
        run: |
          git config --local user.email "data-bot@github.com"
          git config --local user.name "Data Fetch Bot"
          git add -f archive_probe.txt
          git diff --staged --quiet || git commit -m "diag: kraken archive probe results"
          git push origin master
