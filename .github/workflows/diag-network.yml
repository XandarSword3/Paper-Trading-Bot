name: Diagnose Data Source Reachability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe data sources
        run: |
          {
            echo "=== Binance ping ==="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 10 https://api.binance.com/api/v3/ping
            echo "=== Binance klines (1 candle) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 10 "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=1"
            echo "=== Kraken OHLC (BTCUSD, 4h) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 10 "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=240" | head -c 2000
            echo ""
            echo "=== CryptoCompare histohour ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 10 "https://min-api.cryptocompare.com/data/v2/histohour?fsym=BTC&tsym=USD&limit=5"
            echo ""
            echo "=== Runner public IP / region ==="
            curl -s --max-time 10 https://ipinfo.io/json
          } > diag_output.txt 2>&1 || true
          cat diag_output.txt

      - name: Commit diagnostic output
        run: |
          git config --local user.email "data-bot@github.com"
          git config --local user.name "Data Fetch Bot"
          git add -f diag_output.txt
          git diff --staged --quiet || git commit -m "diag: network probe results"
          git push origin master
