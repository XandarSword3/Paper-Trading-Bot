name: BTC Trading Bot

on:
  schedule:
    # V4 runs every hour (fast strategy)
    - cron: '5 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow pushing commits (state/trades under data/ are the persistence layer — see .gitignore note)

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests sqlalchemy
      
      - name: Get current hour
        id: hour
        run: echo "hour=$(date -u +'%H')" >> $GITHUB_OUTPUT
      
      - name: Run V4 Bot (hourly - 1H candles)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "===== V4 HIGH-FREQUENCY BOT ====="
          python -m research.bots.bot_runner --strategy v4
      
      - name: Run V1 Bot (every 4H - only at 0,4,8,12,16,20 UTC)
        if: contains('0,4,8,12,16,20', steps.hour.outputs.hour)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "===== V1 TURTLE BOT ====="
          python -m research.bots.bot_runner --strategy v1

      - name: Commit state changes
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Trading Bot"
          git add data/bot_state.json data/trades.json data/bot_state_v4.json data/trades_v4.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Bot update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master
