name: Funding Carry Validation

# Validates the BTC Funding-Rate Carry strategy (funding_rate_carry.py):
# a static, always-on long-spot/short-perp hedge with no signal logic and
# no tunable parameters — so unlike walk_forward_validation.yml this needs
# no grid search, no folds, and no matrix. One job, a couple of minutes.
#
# Refreshes funding-rate data first (same fetch_rate_history call the
# standalone "Fetch Funding Rate Data" workflow uses) so the committed
# results always reflect the latest available settlements, then runs the
# backtest and commits funding_carry_results.json +
# results/funding_carry_equity.csv.

on:
  workflow_dispatch:
  push:
    branches:
      - research/funding-rate-carry

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests tqdm pyarrow

      - name: Refresh BTCUSDT funding rate history
        env:
          PYTHONPATH: ${{ github.workspace }}/research/strategies:${{ github.workspace }}/research/data
        run: |
          set +e
          python research/data/_ci_fetch_funding.py > funding_fetch_log.txt 2>&1
          ec=$?
          cat funding_fetch_log.txt
          echo "exit_code=$ec" >> funding_fetch_log.txt
          exit $ec

      - name: Run funding-carry backtest
        env:
          PYTHONPATH: ${{ github.workspace }}/research/strategies:${{ github.workspace }}/research/data
        run: |
          set +e
          python research/strategies/funding_rate_carry.py --out funding_carry_results.json > backtest_log.txt 2>&1
          ec=$?
          cat backtest_log.txt
          echo "exit_code=$ec" >> backtest_log.txt
          exit $ec

      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research/strategies:${{ github.workspace }}/research/data
        run: |
          pip install pytest
          pytest tests/test_funding_carry.py -v

      - name: Debug dump (temporary — diagnosing CI failures)
        if: always()
        run: |
          {
            echo "=== pwd ==="; pwd
            echo "=== ls -la workspace root ==="; ls -la
            echo "=== find any *_log.txt ==="; find . -name "*_log.txt" -not -path "./.git/*" -exec echo "--{}--" \; -exec cat {} \;
            echo "=== find funding_carry_results.json ==="; find . -name "funding_carry_results.json" -not -path "./.git/*"
            echo "=== research/strategies/data listing ==="; ls -la research/strategies/data 2>&1
            echo "=== python version ==="; python --version
            echo "=== PYTHONPATH ==="; echo "$PYTHONPATH"
          } > ci_debug.txt 2>&1

      - name: Commit results
        if: always()
        run: |
          git config --local user.email "validation-bot@github.com"
          git config --local user.name "Validation Bot"
          git add -A
          git diff --staged --quiet || git commit -m "funding carry validation: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin master
          git push origin HEAD:${{ github.ref_name }}
