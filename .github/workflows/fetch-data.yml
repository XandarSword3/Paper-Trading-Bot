name: Fetch Historical Data

on:
  workflow_dispatch:      # manual trigger, or trigger via API
  schedule:
    - cron: '0 6 * * 1'   # weekly refresh, Monday 06:00 UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: pip install pandas numpy requests tqdm pyarrow

      - name: Fetch BTCUSDT historical data (4h and 1h)
        run: |
          python -c "
          from data_fetcher import download_btc_data

          for tf in ['4h', '1h']:
              print(f'Fetching {tf}...')
              try:
                  df = download_btc_data(timeframe=tf, start_date='2017-01-01', force_refresh=True, source='auto')
                  print(f'{tf}: {len(df)} candles, {df.index[0]} -> {df.index[-1]}')
              except Exception as e:
                  print(f'{tf} FAILED: {e}')
          "

      - name: Commit and push data
        if: always()
        run: |
          git config --local user.email "data-bot@github.com"
          git config --local user.name "Data Fetch Bot"
          git add -f data/BTCUSDT_4h.parquet data/BTCUSDT_4h.csv data/BTCUSDT_1h.parquet data/BTCUSDT_1h.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: refresh BTCUSDT historical dataset via Kraken fallback ($(date -u +'%Y-%m-%d'))"
          git push origin master
