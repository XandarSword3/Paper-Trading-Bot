name: Probe Alternate Historical Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe Bitstamp + CryptoDataDownload
        run: |
          {
            echo "=== Bitstamp OHLC, step=14400 (4h), far back start ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 15 "https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=14400&limit=5&start=1483228800" | head -c 1500
            echo ""
            echo "=== Bitstamp OHLC, no start (recent) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 15 "https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=14400&limit=3"
            echo ""
            echo "=== CryptoDataDownload Kraken BTCUSD 1h CSV (head) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 20 "https://www.cryptodatadownload.com/cdd/Kraken_BTCUSD_1h.csv" | head -c 800
            echo ""
            echo "=== CryptoDataDownload Bitstamp BTCUSD 1h CSV (head) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 20 "https://www.cryptodatadownload.com/cdd/Bitstamp_BTCUSD_1h.csv" | head -c 800
            echo ""
            echo "=== CryptoDataDownload Coinbase BTC-USD 1h CSV (head) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 20 "https://www.cryptodatadownload.com/cdd/Coinbase_BTCUSD_1h.csv" | head -c 800
          } > source_probe.txt 2>&1
          cat source_probe.txt

      - name: Commit probe results
        if: always()
        run: |
          git config --local user.email "data-bot@github.com"
          git config --local user.name "Data Fetch Bot"
          git add -f source_probe.txt
          git diff --staged --quiet || git commit -m "diag: probe Bitstamp API + CryptoDataDownload CSV availability"
          git push origin master
