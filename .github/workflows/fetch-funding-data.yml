name: Fetch Funding Rate Data

on:
  workflow_dispatch:      # manual trigger, or trigger via API
  push:                   # workflow_dispatch needs the file on the default
    branches:             # branch to be dispatchable via API - push works
      - research/funding-rate-carry   # off any branch, so use that to fire
                                       # this first run without touching master

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: pip install pandas numpy requests tqdm pyarrow

      - name: Fetch BTCUSDT funding rate history
        # Known broken: Binance fapi.binance.com returns HTTP 451 to
        # GitHub-hosted runner IPs (confirmed via the OKX fetcher's own
        # docstring, which documents this exact block). Left as-is rather
        # than switched to OKX, since OKX's public endpoint only serves a
        # ~1-month trailing window (confirmed empirically: the ETH fetch
        # below returned exactly 100 settlements / ~33 days) and would
        # regress the existing 7-year Binance-sourced BTC history if it
        # force-overwrote the file. Soft-fails (set +e) so it never blocks
        # the ETH fetch step below.
        run: |
          set +e
          python research/data/funding_rate_fetcher.py > funding_fetch_log.txt 2>&1
          echo "exit_code=$?" >> funding_fetch_log.txt
          cat funding_fetch_log.txt

      - name: Fetch ETHUSDT funding rate history (OKX — Binance/Bybit blocked from CI)
        run: |
          set +e
          python research/data/fetch_eth_funding_ci.py 2>&1 | tee eth_funding_fetch_log.txt
          echo "python_exit_code=${PIPESTATUS[0]}" >> eth_funding_fetch_log.txt

      - name: Commit and push data
        if: always()
        run: |
          git config --local user.email "data-bot@github.com"
          git config --local user.name "Data Fetch Bot"
          # Rebase onto the latest remote state first — this repo also runs
          # a funding-carry paper-trading bot on its own schedule that
          # commits to master frequently, so a plain push here can race it.
          git pull --rebase origin ${{ github.ref_name }} || true
          git add -f data/BTCUSDT_funding_rate.parquet data/BTCUSDT_funding_rate.csv \
                     data/ETHUSDT_funding_rate.parquet data/ETHUSDT_funding_rate.csv \
                     data/MANIFEST.json funding_fetch_log.txt eth_funding_fetch_log.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: fetch funding rate history ($(date -u +'%Y-%m-%d'))"
          git push origin HEAD:${{ github.ref_name }}
