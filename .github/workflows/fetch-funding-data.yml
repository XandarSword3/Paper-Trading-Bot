name: Fetch Funding Rate Data

on:
  workflow_dispatch:      # manual trigger, or trigger via API
  push:                   # workflow_dispatch needs the file on the default
    branches:             # branch to be dispatchable via API - push works
      - research/funding-rate-carry   # off any branch, so use that to fire
                                       # this first run without touching master

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: pip install pandas numpy requests tqdm pyarrow

      - name: Fetch BTCUSDT funding rate history
        # Known broken: Binance fapi.binance.com returns HTTP 451 to
        # GitHub-hosted runner IPs (confirmed via the OKX fetcher's own
        # docstring, which documents this exact block). Left as-is rather
        # than switched to OKX, since OKX's public endpoint only serves a
        # ~1-month trailing window (confirmed empirically: the ETH fetch
        # below returned exactly 100 settlements / ~33 days) and would
        # regress the existing 7-year Binance-sourced BTC history if it
        # force-overwrote the file. Soft-fails (set +e) so it never blocks
        # the ETH fetch step below.
        run: |
          set +e
          python research/data/funding_rate_fetcher.py > funding_fetch_log.txt 2>&1
          echo "exit_code=$?" >> funding_fetch_log.txt
          cat funding_fetch_log.txt

      - name: Fetch ETHUSDT funding rate history (OKX — Binance/Bybit blocked from CI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python research/data/fetch_eth_funding_ci.py 2>&1 | tee eth_funding_fetch_log.txt
          echo "python_exit_code=${PIPESTATUS[0]}" >> eth_funding_fetch_log.txt

          # Deliver the fetched files via the GitHub Contents API directly,
          # rather than relying solely on git add/commit/push. This repo's
          # git-based commit step has failed to land changes across several
          # debugging attempts for reasons never fully confirmed (raw CI
          # logs are hosted on Azure blob storage, outside the network
          # allowlist of the environment that built this pipeline) — while
          # a Contents-API write was independently verified to work
          # reliably in that same debugging session. Kept as a second,
          # independent delivery path rather than the sole one, since git
          # push *should* work and may simply have been racing the
          # concurrent funding-carry paper-bot's own commits.
          if [ -f data/ETHUSDT_funding_rate.csv ]; then
            for f in data/ETHUSDT_funding_rate.csv data/ETHUSDT_funding_rate.parquet; do
              if [ -f "$f" ]; then
                CONTENT_B64=$(base64 -w0 "$f")
                EXISTING_SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$f?ref=${{ github.ref_name }}" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null)
                if [ -n "$EXISTING_SHA" ]; then
                  PAYLOAD="{\"message\":\"data: fetch ETHUSDT funding rate via OKX (Contents API)\",\"content\":\"$CONTENT_B64\",\"branch\":\"${{ github.ref_name }}\",\"sha\":\"$EXISTING_SHA\"}"
                else
                  PAYLOAD="{\"message\":\"data: fetch ETHUSDT funding rate via OKX (Contents API)\",\"content\":\"$CONTENT_B64\",\"branch\":\"${{ github.ref_name }}\"}"
                fi
                curl -s -X PUT \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$f" \
                  -d "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Contents API result for $f:', 'OK' if 'content' in d else d.get('message'))"
              fi
            done
          else
            echo "No ETH data file to deliver — fetch step did not produce output"
          fi

      - name: Commit and push data
        if: always()
        run: |
          git config --local user.email "data-bot@github.com"
          git config --local user.name "Data Fetch Bot"
          # Rebase onto the latest remote state first — this repo also runs
          # a funding-carry paper-trading bot on its own schedule that
          # commits to master frequently, so a plain push here can race it.
          git pull --rebase origin ${{ github.ref_name }} || true
          git add -f data/BTCUSDT_funding_rate.parquet data/BTCUSDT_funding_rate.csv \
                     data/ETHUSDT_funding_rate.parquet data/ETHUSDT_funding_rate.csv \
                     data/MANIFEST.json funding_fetch_log.txt eth_funding_fetch_log.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: fetch funding rate history ($(date -u +'%Y-%m-%d'))"
          git push origin HEAD:${{ github.ref_name }}
