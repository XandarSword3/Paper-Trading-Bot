name: RGMT Daily Paper Trader

on:
  schedule:
    # Runs daily at 00:05 UTC (5 minutes after daily candle close)
    - cron: '5 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pytest

      - name: Run RGMT Accounting & Safety Tests
        run: |
          python -m pytest -q tests/test_rgmt_paper_accounting.py tests/test_rgmt_live_safety.py

      - name: Execute RGMT Daily Rebalance
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/run_rgmt_remote.py --mode paper --capital 10000

      - name: Verify Paper State Health
        run: |
          python -c "import json,sys; s=json.load(open('data/rgmt_paper_state.json')); e=s.get('health_error'); print('RGMT state health_error: %s' % e) if e else print('RGMT state healthy: equity=%s halted=%s' % (s.get('equity'), s.get('halted'))); sys.exit(1 if e else 0)"

      - name: Commit & Push State Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [RGMT]"
          git add data/rgmt_paper_state.json data/rgmt_targets.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "RGMT daily paper rebalance: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || git push origin master
